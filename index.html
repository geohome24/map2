<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전국 분양현장 지도</title>
  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    }
    #detail-panel {
      display: none;
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 310px;
      max-width: calc(100% - 32px);
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      padding: 16px;
      z-index: 30;
    }
    #close-btn {
      float: right;
      border: none;
      background: transparent;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }
    .pin-badge {
      background: #ffffff;
      border: 2px solid #111111;
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 700;
      color: #111111;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }
    .consult-btn {
      display: inline-block;
      margin-top: 12px;
      padding: 9px 14px;
      background: #fee500;
      color: #191919;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=42553244187f3d43b01f98a4468460dc&autoload=false"></script>
</head>
<body>
  <div id="map"></div>

  <div id="detail-panel">
    <button id="close-btn" type="button" aria-label="닫기">×</button>
    <h3 id="site-title" style="margin: 0 0 8px 0; font-size: 17px;"></h3>
    <p id="site-status" style="margin: 0 0 6px 0; color: #0066cc; font-weight: 700; font-size: 13px;"></p>
    <p id="site-viewers" style="margin: 0 0 10px 0; font-size: 13px; color: #333;"></p>
    <p id="site-desc" style="margin: 0; font-size: 13px; color: #555; line-height: 1.45;"></p>
    <a id="kakao-link" class="consult-btn" href="https://pf.kakao.com" target="_blank" rel="noopener noreferrer">카카오톡 채널 상담</a>
  </div>

  <script>
    const defaultSites = [
      {
        name: '힐스테이트 연산',
        status: '분양 상담 진행 중',
        viewers: 12,
        lat: 35.1846,
        lng: 129.0807,
        desc: '부산 연제구 연산동 분양현장 안내입니다.'
      },
      {
        name: '한화포레나 덕천3차',
        status: '분양 상담 진행 중',
        viewers: 8,
        lat: 35.2106,
        lng: 129.0056,
        desc: '부산 북구 덕천동 분양현장 안내입니다.'
      }
    ];

    function initMap(sites) {
      const mapEl = document.getElementById('map');
      const map = new kakao.maps.Map(mapEl, {
        center: new kakao.maps.LatLng(36.3504, 127.3845),
        level: 12
      });

      const panel = document.getElementById('detail-panel');
      document.getElementById('close-btn').onclick = function () {
        panel.style.display = 'none';
      };

      (sites && sites.length ? sites : defaultSites).forEach(function (site) {
        const lat = Number(site.lat);
        const lng = Number(site.lng);
        if (!lat || !lng) return;

        const pos = new kakao.maps.LatLng(lat, lng);
        const marker = new kakao.maps.Marker({ map: map, position: pos });

        const badge = document.createElement('div');
        badge.className = 'pin-badge';
        badge.textContent = `${site.name} · ${site.status || '분양중'} · ${site.viewers || 1}명`;

        const openPanel = function () {
          document.getElementById('site-title').textContent = site.name;
          document.getElementById('site-status').textContent = site.status || '분양 정보';
          document.getElementById('site-viewers').textContent = `현재 보는 중: ${site.viewers || 1}명`;
          document.getElementById('site-desc').textContent = site.desc || '';
          panel.style.display = 'block';
        };

        badge.onclick = openPanel;
        kakao.maps.event.addListener(marker, 'click', openPanel);

        new kakao.maps.CustomOverlay({
          map: map,
          position: pos,
          content: badge,
          yAnchor: 2.35
        });
      });
    }

    window.addEventListener('message', function (event) {
      if (event.data && event.data.type === 'SITE_DATA' && Array.isArray(event.data.sites)) {
        initMap(event.data.sites);
      }
    });

    kakao.maps.load(function () {
      initMap(defaultSites);
    });
  </script>
</body>
</html>
