  <script>
    const API_SERVICE_KEY = '935de5c23598a914dd97149a0b92614db7f4de28d991d658d58dfaca03bad3a7';

    const ALIAS_GROUPS = [
      ['중흥', '중흥s클래스', 's클래스', '에스클래스'],
      ['푸르지오', '대우'],

    let activeSiteForConsult = null;

    function sendLeadToSheet(payload) {
      if (!LEAD_WEBHOOK_URL) return;
      try {
        if (navigator.sendBeacon) {
          const blob = new Blob([JSON.stringify(payload)], { type: 'text/plain;charset=utf-8' });
          navigator.sendBeacon(LEAD_WEBHOOK_URL, blob);
          return;
        }
      } catch (e) {}

      fetch(LEAD_WEBHOOK_URL, {
        method: 'POST',
        mode: 'no-cors',
        keepalive: true,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).catch(function () {});
    }

    function normalizeSearchKey(str) {
      return String(str || '')
        .toLowerCase()
        .replace(/[\s\-·.,()\[\]/_]+/g, '');
    }

    function expandQueryAliases(normToken) {
      const set = new Set([normToken]);
      ALIAS_GROUPS.forEach((group) => {
        if (group.some((alias) => alias.includes(normToken) || normToken.includes(alias))) {
          group.forEach((alias) => set.add(alias));
        }
      });
      return Array.from(set);
    }

    function matchesFlexibleQuery(item, rawQuery) {
      const trimmed = String(rawQuery || '').trim();
      if (!trimmed) return true;

      const combinedText = `${item.site.name} ${item.site.rawAddress || ''} ${item.site.areaName || ''} ${item.site.aliases || ''}`;
      const normHay = normalizeSearchKey(combinedText);
      const compactQuery = normalizeSearchKey(trimmed);

      if (compactQuery && normHay.includes(compactQuery)) {
        return true;
      }

      const tokens = trimmed.split(/\s+/).map(normalizeSearchKey).filter(Boolean);
      if (tokens.length === 0) return true;

      return tokens.every((tok) => {
        if (normHay.includes(tok)) return true;
        const aliases = expandQueryAliases(tok);
        return aliases.some((al) => normHay.includes(al));
      });
    }

    function formatHyphenDate(val) {
      if (!val) return '';
      const digits = String(val).replace(/[^0-9]/g, '');
      if (digits.length >= 8) {
        return `${digits.slice(0, 4)}-${digits.slice(4, 6)}-${digits.slice(6, 8)}`;
      }
      if (digits.length === 6) {
        return `${digits.slice(0, 4)}-${digits.slice(4, 6)}`;
      }
      return String(val).trim();
    }

    function renderInfoLines(lines) {
      const box = document.getElementById('site-desc');
      box.innerHTML = '';
      (lines || []).forEach((text) => {
        const row = document.createElement('div');
        row.className = 'info-line';

        const bullet = document.createElement('span');
        bullet.className = 'info-bullet';
        bullet.textContent = '•';

        const content = document.createElement('span');
        content.className = 'info-text';
        content.textContent = text;

        row.appendChild(bullet);
        row.appendChild(content);
        box.appendChild(row);
      });
    }

    function getSlotIndex30Min() {
      return Math.floor(Date.now() / (30 * 60 * 1000));
    }

    function getDynamicViewers(site, idx) {
      const slot = getSlotIndex30Min();
      const seed = site.name.split('').reduce((acc, ch) => acc + ch.charCodeAt(0), 0);
      const base = 20 + ((seed + idx * 7) % 31);
      const step = ((slot * 3 + idx * 5 + seed) % 7) - 3;
      const val = base + step;
      if (val < 20) return 20 + (Math.abs(val) % 5);
      if (val > 50) return 50 - (val % 5);
      return val;
    }

    function formatManToWonText(man) {
      const n = Math.max(0, Math.round(Number(man) || 0));
      const eok = Math.floor(n / 10000);
      const remMan = n % 10000;
      const manStr = n.toLocaleString('ko-KR') + '만원';
      if (eok > 0) {
        return remMan > 0 ? `${eok}억 ${remMan.toLocaleString('ko-KR')}만원` : `${eok}억 원`;
      }
      return manStr;
    }

    let currentRate = 0.05;

    function getCalcSummaryText() {
      const totalMan = Math.max(0, Number(document.getElementById('total-price-input').value) || 0);
      const downMan = Math.round(totalMan * currentRate);
      const middleMan = Math.round(totalMan * 0.60);
      const balanceMan = Math.max(0, totalMan - downMan - middleMan);
      const ratePct = Math.round(currentRate * 100);
      const remPct = Math.max(0, 40 - ratePct);

      return (
        `총분양대금 ${formatManToWonText(totalMan)} / ` +
        `계약금(${ratePct}%) ${formatManToWonText(downMan)} / ` +
        `중도금(60%) ${formatManToWonText(middleMan)} / ` +
        `잔금(${remPct}%) ${formatManToWonText(balanceMan)}`
      );
    }

    function updateCalc() {
      const totalMan = Math.max(0, Number(document.getElementById('total-price-input').value) || 0);
      const downMan = Math.round(totalMan * currentRate);
      const middleMan = Math.round(totalMan * 0.60);
      const balanceMan = Math.max(0, totalMan - downMan - middleMan);

      document.getElementById('calc-result').innerHTML =
        `총분양대금: <strong>${formatManToWonText(totalMan)}</strong><br>` +
        `• 계약금 (${Math.round(currentRate * 100)}%): <strong>${formatManToWonText(downMan)}</strong><br>` +
        `• 중도금 (60%): <strong>${formatManToWonText(middleMan)}</strong><br>` +
        `• 잔금 (${Math.max(0, 40 - Math.round(currentRate * 100))}%): <strong>${formatManToWonText(balanceMan)}</strong>`;
    }

    function formatDateObjYYYYMMDD(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}${m}${d}`;
    }

    function getTodayYYYYMMDD() {
      return formatDateObjYYYYMMDD(new Date());
    }

    function getTwoYearsAgoYYYYMMDD() {
      const dt = new Date();
      dt.setFullYear(dt.getFullYear() - 2);
      return formatDateObjYYYYMMDD(dt);
    }

    function normalizeDateDigits(val) {
      if (!val) return '';
      return String(val).replace(/[^0-9]/g, '').slice(0, 8);
    }

    function cleanSupplyAddress(rawAddr) {
      if (!rawAddr) return '';
      return String(rawAddr)
        .replace(/\([^)]*\)/g, ' ')
        .replace(/외\s*\d+\s*필지.*/g, '')
        .replace(/일원.*/g, '')
        .replace(/일대.*/g, '')
        .replace(/[A-Za-z0-9-]+블록.*/g, '')
        .replace(/지구.*/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    async function fetchModelPriceMap() {
      const priceMap = new Map();
      const infoMap = new Map();
      try {
        const pages = [1, 2, 3, 4];
        const responses = await Promise.all(
          pages.map((p) =>
            fetch(`${API_MODEL_ENDPOINT}?page=${p}&perPage=1000&serviceKey=${encodeURIComponent(API_SERVICE_KEY)}`)
              .then((r) => (r.ok ? r.json() : { data: [] }))
              .catch(() => ({ data: [] }))
          )
        );

        responses.forEach((json) => {
          const rows = Array.isArray(json.data) ? json.data : [];
          rows.forEach((m) => {
            const manageNo = String(m.HOUSE_MANAGE_NO || '');
            const rawAmt = String(m.LTTOT_TOP_AMOUNT || '').replace(/[^0-9]/g, '');
            const amtMan = Number(rawAmt);
            if (!manageNo || !amtMan || amtMan <= 0) return;

            const modelType = m.HOUSE_TY || '';
            const existing = priceMap.get(manageNo);
            const is84 = /^0?84/.test(modelType);
            if (!existing || is84) {
              priceMap.set(manageNo, amtMan);
              if (modelType) infoMap.set(manageNo, `${modelType}㎡ 최고가`);
            }
          });
        });
      } catch (e) {}
      return { priceMap, infoMap };
    }

    async function fetchFirstComeSites() {
      const detailPages = [1, 2, 3, 4];
      const [detailJsons, modelData] = await Promise.all([
        Promise.all(
          detailPages.map((p) =>
            fetch(`${API_DETAIL_ENDPOINT}?page=${p}&perPage=1000&serviceKey=${encodeURIComponent(API_SERVICE_KEY)}`)
              .then((r) => (r.ok ? r.json() : { data: [] }))
              .catch(() => ({ data: [] }))
          )
        ),
        fetchModelPriceMap()
      ]);

      const allRows = [];
      const seenManageNos = new Set();
      detailJsons.forEach((json) => {
        const rows = Array.isArray(json.data) ? json.data : [];
        rows.forEach((row) => {
          const id = String(row.HOUSE_MANAGE_NO || row.HOUSE_NM || '');
          if (id && !seenManageNos.has(id)) {
            seenManageNos.add(id);
            allRows.push(row);
          }
        });
      });

      const todayStr = getTodayYYYYMMDD();
      const twoYearsAgoStr = getTwoYearsAgoYYYYMMDD();

      const filtered = allRows.filter((row) => {
        const contractEnd = normalizeDateDigits(row.CNTRCT_CNCLS_ENDDE);
        if (!contractEnd || contractEnd.length !== 8 || contractEnd >= todayStr) {
          return false;
        }
        const isOlderThanTwoYears = contractEnd < twoYearsAgoStr;
        if (isOlderThanTwoYears) {
          const totalUnits = Number(String(row.TOT_SUPLY_HSHLDCO || '0').replace(/[^0-9]/g, ''));
          return totalUnits > 500;
        }
        return true;
      });

      const apiMapped = filtered.map((row, idx) => {
        const manageNo = String(row.HOUSE_MANAGE_NO || '');
        const name = row.HOUSE_NM || `분양현장 ${idx + 1}`;
        const rawAddress = row.HSSPLY_ADRES || '';
        const areaName = row.SUBSCRPT_AREA_CODE_NM || '';
        const totalUnits = Number(String(row.TOT_SUPLY_HSHLDCO || '0').replace(/[^0-9]/g, ''));
        const supplyCnt = totalUnits > 0 ? `총 ${totalUnits}세대` : '';
        const contractEndDigits = normalizeDateDigits(row.CNTRCT_CNCLS_ENDDE);
        const isOlderThanTwoYears = contractEndDigits && contractEndDigits < twoYearsAgoStr;
        const contractEndHyphen = formatHyphenDate(row.CNTRCT_CNCLS_ENDDE);
        const moveInHyphen = formatHyphenDate(row.MVN_PREARNGE_YM);

        const infoParts = [];
        if (supplyCnt) infoParts.push(supplyCnt);
        if (contractEndHyphen) infoParts.push(`정당계약종료 ${contractEndHyphen}`);
        if (moveInHyphen) infoParts.push(`입주예정 ${moveInHyphen}`);

        const realPriceMan = modelData.priceMap.get(manageNo);
        const typeLabel = modelData.infoMap.get(manageNo);
        const marketLines = buildMarketLines(rawAddress, areaName);

        const lines = [
          `공급위치: ${rawAddress || areaName}`,
          `분양정보: ${infoParts.length ? infoParts.join(' · ') : '정당계약일 경과 · 상담 진행 중'}` +
            (typeLabel ? ` (${typeLabel})` : ''),
          ...marketLines
        ];

        return {
          name,
          aliases: '',
          rawAddress,
          areaName,
          status: isOlderThanTwoYears ? STATUS_OLD_LARGE_TEXT : STATUS_NORMAL_TEXT,
          statusColor: isOlderThanTwoYears ? STATUS_OLD_LARGE_COLOR : STATUS_NORMAL_COLOR,
          defaultPriceMan: realPriceMan || 55000,
          infoLines: lines
        };
      });

      const existingNames = new Set(apiMapped.map((s) => normalizeSearchKey(s.name)));
      VERIFIED_EXTRA_SITES.forEach((extraSite) => {
        const norm = normalizeSearchKey(extraSite.name);
        if (!existingNames.has(norm)) {
          apiMapped.unshift(extraSite);
        }
      });

      return apiMapped;
    }

    function resolveAccurateCoords(geocoder, places, site) {
      return new Promise((resolve) => {
        if (site.fallbackLat && site.fallbackLng) {
          return resolve({ lat: site.fallbackLat, lng: site.fallbackLng });
        }

        const cleaned = cleanSupplyAddress(site.rawAddress);
        const tokens = cleaned.split(' ').filter(Boolean);
        const sigunguPrefix = tokens.slice(0, 2).join(' ');

        const trySigunguFallback = () => {
          if (!sigunguPrefix) return resolve(null);
          places.keywordSearch(sigunguPrefix, function (sData, sStatus) {
            if (sStatus === kakao.maps.services.Status.OK && sData && sData[0]) {
              const jitterLat = ((Math.random() - 0.5) * 0.008);
              const jitterLng = ((Math.random() - 0.5) * 0.008);
              resolve({ lat: Number(sData[0].y) + jitterLat, lng: Number(sData[0].x) + jitterLng });
            } else {
              resolve(null);
            }
          });
        };

        const tryKeywordFallback = () => {
          const kw = `${sigunguPrefix} ${site.name}`.trim();
          if (!kw) return trySigunguFallback();
          places.keywordSearch(kw, function (data, status) {
            if (status === kakao.maps.services.Status.OK && data && data[0]) {
              resolve({ lat: Number(data[0].y), lng: Number(data[0].x) });
            } else {
              places.keywordSearch(site.name, function (data2, status2) {
                if (status2 === kakao.maps.services.Status.OK && data2 && data2[0]) {
                  resolve({ lat: Number(data2[0].y), lng: Number(data2[0].x) });
                } else {
                  trySigunguFallback();
                }
              });
            }
          });
        };

        const primaryKw = `${sigunguPrefix} ${site.name}`.trim();
        places.keywordSearch(primaryKw, function (pData, pStatus) {
          if (pStatus === kakao.maps.services.Status.OK && pData && pData[0]) {
            return resolve({ lat: Number(pData[0].y), lng: Number(pData[0].x) });
          }

          if (!cleaned) return tryKeywordFallback();

          geocoder.addressSearch(cleaned, function (result, status) {
            if (status === kakao.maps.services.Status.OK && result && result[0]) {
              resolve({ lat: Number(result[0].y), lng: Number(result[0].x) });
            } else {
              tryKeywordFallback();
            }
          });
        });
      });
    }

    kakao.maps.load(async function () {
      const mapEl = document.getElementById('map');
      const map = new kakao.maps.Map(mapEl, {
        center: new kakao.maps.LatLng(35.1796, 129.0756),
        level: 8
      });
      const geocoder = new kakao.maps.services.Geocoder();
      const places = new kakao.maps.services.Places();
      const toast = document.getElementById('status-toast');
      const panel = document.getElementById('detail-panel');
      const drawer = document.getElementById('district-drawer');
      const districtGrid = document.getElementById('district-grid');
      const dropdown = document.getElementById('search-dropdown');
      const searchInput = document.getElementById('search-input');

      let activeRegionKey = 'busan';
      let isDrawerOpen = false;
      let isSitesLoaded = false;
      let pendingSearchAfterLoad = false;

      function renderDistricts(regionKey) {
        const reg = REGION_DATA[regionKey];
        if (!reg) return;
        districtGrid.innerHTML = '';
        reg.districts.forEach((d) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'district-btn';
          btn.textContent = d.name;
          btn.onclick = function () {
            document.querySelectorAll('.district-btn').forEach((b) => b.classList.remove('selected'));
            btn.classList.add('selected');
            map.setCenter(new kakao.maps.LatLng(d.lat, d.lng));
            map.setLevel(d.level);
            drawer.style.display = 'none';
            isDrawerOpen = false;
          };
          districtGrid.appendChild(btn);
        });
      }

      renderDistricts('busan');

      document.querySelectorAll('.region-tab').forEach((tab) => {
        tab.onclick = function () {
          const key = tab.getAttribute('data-region');
          const wasSame = (activeRegionKey === key);

          document.querySelectorAll('.region-tab').forEach((t) => t.classList.remove('active'));
          tab.classList.add('active');
          activeRegionKey = key;

          renderDistricts(key);

          if (wasSame && isDrawerOpen) {
            drawer.style.display = 'none';
            isDrawerOpen = false;
          } else {
            drawer.style.display = 'block';
            isDrawerOpen = true;
          }

          const reg = REGION_DATA[key];
          if (reg && reg.center) {
            map.setCenter(new kakao.maps.LatLng(reg.center.lat, reg.center.lng));
            map.setLevel(reg.center.level);
          }
        };
      });

      document.getElementById('close-btn').onclick = function () {
        panel.style.display = 'none';
      };

      const btn5 = document.getElementById('rate-5');
      const btn10 = document.getElementById('rate-10');
      const priceInput = document.getElementById('total-price-input');
      const kakaoBtn = document.getElementById('kakao-link');

      btn5.onclick = function () {
        currentRate = 0.05;
        btn5.classList.add('active');
        btn10.classList.remove('active');
        updateCalc();
      };
      btn10.onclick = function () {
        currentRate = 0.10;
        btn10.classList.add('active');
        btn5.classList.remove('active');
        updateCalc();
      };
      priceInput.oninput = updateCalc;

      kakaoBtn.onclick = function () {
        const site = activeSiteForConsult || {};
        const summary = getCalcSummaryText();
        sendLeadToSheet({
          channel: '지도_카톡상담',
          siteName: site.name || '미지정',
          region: site.areaName || REGION_DATA[activeRegionKey]?.label || '부산',
          customerName: '카톡문의고객',
          phone: '-',
          visitDate: '-',
          agree: '동의합니다.',
          conditions: `${summary} / 위치: ${site.rawAddress || site.areaName || '-'}`
        });
      };

      function hideDropdown() {
        dropdown.style.display = 'none';
        dropdown.innerHTML = '';
      }

      function showLoadingInDropdown() {
        dropdown.innerHTML = '<div class="dropdown-loading">분양현장 목록을 불러오는 중입니다...</div>';
        dropdown.style.display = 'block';
      }

      const renderedItems = [];

      function focusMatchedItem(item) {
        map.setCenter(item.pos);
        map.setLevel(5);
        item.openPanel();
        hideDropdown();
      }

      function renderSearchDropdown(matched) {
        dropdown.innerHTML = '';
        if (!matched.length) {
          hideDropdown();
          return;
        }
        matched.forEach((item) => {
          const optBtn = document.createElement('button');
          optBtn.type = 'button';
          optBtn.className = 'search-option';

          const titleEl = document.createElement('span');
          titleEl.className = 'search-option-title';
          titleEl.textContent = item.site.name;

          const subEl = document.createElement('span');
          subEl.className = 'search-option-sub';
          subEl.textContent = item.site.rawAddress || item.site.areaName || '위치 확인 가능';

          optBtn.appendChild(titleEl);
          optBtn.appendChild(subEl);
          optBtn.onclick = function () {
            focusMatchedItem(item);
          };
          dropdown.appendChild(optBtn);
        });
        dropdown.style.display = 'block';
      }

      const previewMatches = function () {
        const q = searchInput.value.trim();
        if (!q) {
          hideDropdown();
          return [];
        }
        if (!isSitesLoaded) {
          pendingSearchAfterLoad = true;
          showLoadingInDropdown();
          return [];
        }
        const matched = renderedItems.filter((item) => matchesFlexibleQuery(item, q));
        renderSearchDropdown(matched);
        return matched;
      };

      const runSearch = function () {
        const rawQ = searchInput.value.trim();
        if (!rawQ) {
          pendingSearchAfterLoad = false;
          hideDropdown();
          renderedItems.forEach((item) => {
            item.marker.setMap(map);
            item.overlay.setMap(map);
          });
          map.setCenter(new kakao.maps.LatLng(35.1796, 129.0756));
          map.setLevel(8);
          return;
        }

        if (!isSitesLoaded) {
          pendingSearchAfterLoad = true;
          showLoadingInDropdown();
          return;
        }

        const matched = [];
        renderedItems.forEach((item) => {
          if (matchesFlexibleQuery(item, rawQ)) {
            item.marker.setMap(map);
            item.overlay.setMap(map);
            matched.push(item);
          } else {
            item.marker.setMap(null);
            item.overlay.setMap(null);
          }
        });

        if (matched.length === 1) {
          focusMatchedItem(matched[0]);
        } else if (matched.length > 1) {
          renderSearchDropdown(matched);
          map.setCenter(matched[0].pos);
          map.setLevel(8);
        } else {
          hideDropdown();
          toast.style.display = 'block';
          toast.textContent = `'${rawQ}' 검색 결과가 없습니다.`;
          setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }
      };

      searchInput.oninput = previewMatches;
      document.getElementById('search-btn').onclick = runSearch;
      searchInput.onkeydown = function (e) {
        if (e.key === 'Enter') runSearch();
      };
      document.getElementById('reset-btn').onclick = function () {
        searchInput.value = '';
        drawer.style.display = 'none';
        isDrawerOpen = false;
        runSearch();
      };

      let apiSites = [];
      try {
        apiSites = await fetchFirstComeSites();
      } catch (e) {
        apiSites = [...VERIFIED_EXTRA_SITES];
      }

      const coordResults = await Promise.all(
        apiSites.map((site) => resolveAccurateCoords(geocoder, places, site))
      );

      apiSites.forEach((site, idx) => {
        const coords = coordResults[idx];
        if (!coords) return;

        const pos = new kakao.maps.LatLng(coords.lat, coords.lng);
        const marker = new kakao.maps.Marker({ map: map, position: pos });
        const viewers = getDynamicViewers(site, idx);

        const badge = document.createElement('div');
        badge.className = 'pin-badge';
        badge.textContent = `${site.name} · ${viewers}명 보는중`;

        const openPanel = function () {
          activeSiteForConsult = site;
          const curViewers = getDynamicViewers(site, idx);
          badge.textContent = `${site.name} · ${curViewers}명 보는중`;
          document.getElementById('site-title').textContent = site.name;
          const statusEl = document.getElementById('site-status');
          statusEl.textContent = site.status;
          statusEl.style.color = site.statusColor || STATUS_NORMAL_COLOR;
          document.getElementById('site-viewers').textContent = `현재 ${curViewers}명 보는중`;
          renderInfoLines(site.infoLines);
          priceInput.value = site.defaultPriceMan;
          updateCalc();
          panel.style.display = 'block';
        };

        badge.onclick = openPanel;
        kakao.maps.event.addListener(marker, 'click', openPanel);

        const overlay = new kakao.maps.CustomOverlay({
          map: map,
          position: pos,
          content: badge,
          yAnchor: 2.35
        });

        renderedItems.push({ site, idx, marker, overlay, badge, pos, openPanel });
      });

      isSitesLoaded = true;
      toast.textContent = `분양현장 ${renderedItems.length}곳 표시 중`;
      setTimeout(() => { toast.style.display = 'none'; }, 3500);

      if (pendingSearchAfterLoad && searchInput.value.trim()) {
        pendingSearchAfterLoad = false;
        runSearch();
      }

      setInterval(function () {
        renderedItems.forEach(function (item) {
          const v = getDynamicViewers(item.site, item.idx);
          item.badge.textContent = `${item.site.name} · ${v}명 보는중`;
        });
      }, 60 * 1000);
    });
  </script>
</body>
</html>
