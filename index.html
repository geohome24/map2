    function getSlotIndex30Min() {
      return Math.floor(Date.now() / (30 * 60 * 1000));
    }

    function getDynamicViewers(site, idx) {
      const slot = getSlotIndex30Min();
      const seed = site.name.split('').reduce((acc, ch) => acc + ch.charCodeAt(0), 0);
      const base = 20 + ((seed + idx * 7) % 31);
      const step = ((slot * 3 + idx * 5 + seed) % 7) - 3;
      const val = base + step;
      if (val < 20) return 20 + (Math.abs(val) % 5);
      if (val > 50) return 50 - (val % 5);
      return val;
    }

    function formatManToWonText(man) {
      const n = Math.max(0, Math.round(Number(man) || 0));
      const eok = Math.floor(n / 10000);
      const remMan = n % 10000;
      const manStr = n.toLocaleString('ko-KR') + '만원';
      if (eok > 0) {
        return remMan > 0 ? `${eok}억 ${remMan.toLocaleString('ko-KR')}만원` : `${eok}억 원`;
      }
      return manStr;
    }

    let currentRate = 0.05;

    function updateCalc() {
      const totalMan = Math.max(0, Number(document.getElementById('total-price-input').value) || 0);
      const downMan = Math.round(totalMan * currentRate);
      const middleMan = Math.round(totalMan * 0.60);
      const balanceMan = Math.max(0, totalMan - downMan - middleMan);

      document.getElementById('calc-result').innerHTML =
        `총분양대금: <strong>${formatManToWonText(totalMan)}</strong><br>` +
        `• 계약금 (${Math.round(currentRate * 100)}%): <strong>${formatManToWonText(downMan)}</strong><br>` +
        `• 중도금 (60%): <strong>${formatManToWonText(middleMan)}</strong><br>` +
        `• 잔금 (${Math.max(0, 40 - Math.round(currentRate * 100))}%): <strong>${formatManToWonText(balanceMan)}</strong>`;
    }

    async function fetchCheongyakSites() {
      const url = `${API_ENDPOINT}?page=1&perPage=60&serviceKey=${encodeURIComponent(API_SERVICE_KEY)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('API 응답 오류');
      const json = await res.json();
      const rows = Array.isArray(json.data) ? json.data : [];
      if (!rows.length) throw new Error('데이터 없음');

      return rows.map((row, idx) => {
        const name = row.HOUSE_NM || `분양현장 ${idx + 1}`;
        const address = row.HSSPLY_ADRES || row.SUBSCRPT_AREA_CODE_NM || '';
        const supplyCnt = row.TOT_SUPLY_HSHLDCO ? `총 ${row.TOT_SUPLY_HSHLDCO}세대` : '';
        const moveIn = row.MVN_PREARNGE_YM ? `입주예정 ${row.MVN_PREARNGE_YM}` : '';
        const tel = row.MDHS_TELNO ? `문의 ${row.MDHS_TELNO}` : '';
        const extra = [supplyCnt, moveIn, tel].filter(Boolean).join(' · ');

        return {
          name,
          address,
          status: '선착순 미분양 상담중',
          defaultPriceMan: 55000,
          desc:

        };
      });

    function geocodeAddress(geocoder, address) {
      return new Promise((resolve) => {
        if (!address) return resolve(null);
        const cleanAddr = address.replace(/\([^)]*\)/g, '').trim();
        geocoder.addressSearch(cleanAddr, function (result, status) {
          if (status === kakao.maps.services.Status.OK && result && result[0]) {
            resolve({ lat: Number(result[0].y), lng: Number(result[0].x) });
          } else {
            resolve(null);
          }
        });
      });
    }

            btn.classList.add('selected');
            map.setCenter(new kakao.maps.LatLng(d.lat, d.lng));
            map.setLevel(d.level);
            drawer.style.display = 'none';
            isDrawerOpen = false;
          };
          districtGrid.appendChild(btn);
        });
      }

      renderDistricts('busan');

      document.querySelectorAll('.region-tab').forEach((tab) => {
        tab.onclick = function () {
          const key = tab.getAttribute('data-region');
          const wasSame = (activeRegionKey === key);

          document.querySelectorAll('.region-tab').forEach((t) => t.classList.remove('active'));
          tab.classList.add('active');
          activeRegionKey = key;

          renderDistricts(key);

          if (wasSame && isDrawerOpen) {
            drawer.style.display = 'none';
            isDrawerOpen = false;
          } else {
            drawer.style.display = 'block';
            isDrawerOpen = true;
          }

          const reg = REGION_DATA[key];
          if (reg && reg.center) {
            map.setCenter(new kakao.maps.LatLng(reg.center.lat, reg.center.lng));
            map.setLevel(reg.center.level);
          }
        };
      });

      document.getElementById('close-btn').onclick = function () {
        panel.style.display = 'none';
      };

      const btn5 = document.getElementById('rate-5');
      const btn10 = document.getElementById('rate-10');
      const priceInput = document.getElementById('total-price-input');

      btn5.onclick = function () {
        currentRate = 0.05;
        btn5.classList.add('active');
        btn10.classList.remove('active');
        updateCalc();
      };
      btn10.onclick = function () {
        currentRate = 0.10;
        btn10.classList.add('active');
        btn5.classList.remove('active');
        updateCalc();
      };
      priceInput.oninput = updateCalc;

      let rawSites = [];
      try {
        rawSites = await fetchCheongyakSites();
        rawSites = [...fallbackSites, ...rawSites];
      } catch (e) {
        rawSites = fallbackSites;
      }

      const renderedItems = [];

      for (let idx = 0; idx < rawSites.length; idx++) {
        const site = rawSites[idx];
        let lat = site.lat;
        let lng = site.lng;

        if (!lat || !lng) {
          const coords = await geocodeAddress(geocoder, site.address);
          if (!coords) continue;
          lat = coords.lat;
          lng = coords.lng;
        }

        const pos = new kakao.maps.LatLng(lat, lng);
        const marker = new kakao.maps.Marker({ map: map, position: pos });
        const viewers = getDynamicViewers(site, idx);

        const badge = document.createElement('div');
        badge.className = 'pin-badge';
        badge.textContent = `${site.name} · ${viewers}명 보는중`;

        const openPanel = function () {
          const curViewers = getDynamicViewers(site, idx);
          badge.textContent = `${site.name} · ${curViewers}명 보는중`;
          document.getElementById('site-title').textContent = site.name;
          document.getElementById('site-status').textContent = site.status || '선착순 미분양 상담중';
          document.getElementById('site-viewers').textContent = `현재 ${curViewers}명 보는중`;
          document.getElementById('site-desc').textContent = site.desc || '';
          priceInput.value = site.defaultPriceMan || 55000;
          updateCalc();
          panel.style.display = 'block';
        };

        badge.onclick = openPanel;
        kakao.maps.event.addListener(marker, 'click', openPanel);

        const overlay = new kakao.maps.CustomOverlay({
          map: map,
          position: pos,
          content: badge,
          yAnchor: 2.35
        });

        renderedItems.push({ site, idx, marker, overlay, badge, pos });
      }

      toast.textContent = `전국 분양현장 ${renderedItems.length}곳 표시 중`;
      setTimeout(() => { toast.style.display = 'none'; }, 3000);

      setInterval(function () {
        renderedItems.forEach(function (item) {
          const v = getDynamicViewers(item.site, item.idx);
          item.badge.textContent = `${item.site.name} · ${v}명 보는중`;
        });
      }, 60 * 1000);

      const searchInput = document.getElementById('search-input');
      const runSearch = function () {
        const q = searchInput.value.trim().toLowerCase();
        if (!q) {
          renderedItems.forEach((item) => {
            item.marker.setMap(map);
            item.overlay.setMap(map);
          });
          map.setCenter(new kakao.maps.LatLng(35.1796, 129.0756));
          map.setLevel(8);
          return;
        }

        const matched = [];
        renderedItems.forEach((item) => {
          const hay = `${item.site.name} ${item.site.address || ''}`.toLowerCase();
          if (hay.includes(q)) {
            item.marker.setMap(map);
            item.overlay.setMap(map);
            matched.push(item);
          } else {
            item.marker.setMap(null);
            item.overlay.setMap(null);
          }
        });

        if (matched.length > 0) {
          map.setCenter(matched[0].pos);
          map.setLevel(matched.length === 1 ? 5 : 8);
        } else {
          toast.style.display = 'block';
          toast.textContent = `'${searchInput.value.trim()}' 검색 결과가 없습니다.`;
          setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }
      };

      document.getElementById('search-btn').onclick = runSearch;
      searchInput.onkeydown = function (e) {
        if (e.key === 'Enter') runSearch();
      };
      document.getElementById('reset-btn').onclick = function () {
        searchInput.value = '';
        drawer.style.display = 'none';
        isDrawerOpen = false;
        runSearch();
      };
    });
  </script>
</body>
</html>
