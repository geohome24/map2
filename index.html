<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고객 전용 분양현장 상담 지도</title>
  <style>
    html, body, iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    id="mapFrame"
    src="https://geohome24.github.io/map2/"
    allow="geolocation"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      const frame = document.getElementById('mapFrame');
      if (typeof google !== 'undefined' && google.script && google.script.run && typeof getSiteData === 'function') {
        google.script.run
          .withSuccessHandler(function (sites) {
            if (frame && frame.contentWindow) {
              frame.contentWindow.postMessage({ type: 'SITE_DATA', sites: sites }, 'https://geohome24.github.io');
            }
          })
          .getSiteData();
      }
    });
  </script>
</body>
</html>
